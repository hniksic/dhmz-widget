# HAProxy CORS proxy for DHMZ and pljusak.com weather data
# Accepts requests in standard CORS proxy format:
#   http://<host>:8080/https://vrijeme.hr/hrvatska1_n.xml
#   http://<host>:8080/https://pljusak.com/karta.php

listen weather_proxy
    bind *:8080
    mode http

    acl is_pljusak path_beg /https://pljusak.com/
    acl is_dhmz path_beg /https://vrijeme.hr/

    # Security: only allow known origins (and OPTIONS preflight)
    http-request deny unless is_pljusak || is_dhmz || METH_OPTIONS
    http-request return status 204 if METH_OPTIONS

    # Set Host header before path rewrite (ACLs match on original path)
    http-request set-header Host pljusak.com if is_pljusak
    http-request set-header Host vrijeme.hr if is_dhmz

    # Strip the origin prefix, leaving just the path for the upstream
    http-request set-path %[path,regsub(^/https://pljusak\.com,,)] if is_pljusak
    http-request set-path %[path,regsub(^/https://vrijeme\.hr,,)] if is_dhmz

    # CORS headers
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Content-Type"

    # Server selection
    use-server pljusak if is_pljusak
    use-server dhmz if is_dhmz
    server dhmz vrijeme.hr:443 ssl ca-file /etc/ssl/certs/ca-certificates.crt sni str(vrijeme.hr)
    server pljusak pljusak.com:443 ssl ca-file /etc/ssl/certs/ca-certificates.crt sni str(pljusak.com)
